name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jawaher
          POSTGRES_PASSWORD: jawaher_dev_password
          POSTGRES_DB: jawaher_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jawaher -d jawaher_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://jawaher:jawaher_dev_password@localhost:5432/jawaher_dev?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Must run before typecheck/test: src/modules/* (Phase 4) imports
      # @prisma/client's generated types, and this project has no
      # postinstall hook that generates them automatically.
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Phase 12 — a real initial migration now exists
      # (prisma/migrations/*_init), generated via `prisma migrate diff
      # --from-empty --to-schema` (no live database needed to generate it —
      # see docs/architecture/production-readiness.md). CI now runs the same
      # `migrate deploy` a real production deployment would, against a
      # from-scratch database, instead of `db push` (a dev-only command
      # that bypasses migration history and would never have caught a
      # migration that fails to apply).
      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (verifies prisma/seed.ts against a real Postgres)
        run: npm run db:seed

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
